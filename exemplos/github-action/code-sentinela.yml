# Copie este arquivo para .github/workflows/code-sentinela.yml do repositório que você quer revisar.
#
# Pré-requisitos (uma vez só):
#   1. No seu PC: rode `claude setup-token` (precisa de assinatura Pro ou Max) e copie o token.
#   2. No repositório: Settings > Secrets and variables > Actions > New repository secret
#      Nome: CLAUDE_CODE_OAUTH_TOKEN   Valor: o token do passo 1
#   3. Instale o app do Claude no repositório: https://github.com/apps/claude
#
# Cada PR revisado gasta a cota da sua assinatura, como se você tivesse usado o Claude Code.
name: Code Sentinela

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Permissões mínimas: ler o código e escrever a revisão no PR.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisar:
    # PR vindo de fork não recebe segredos do repositório; nem tentamos rodar.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório revisado
        uses: actions/checkout@v4

      - name: Baixar o Code Sentinela
        uses: actions/checkout@v4
        with:
          repository: Phb29/code-sentinela
          path: .code-sentinela

      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar o servidor MCP
        run: mvn -B -q -f .code-sentinela/servidor-mcp/pom.xml package -DskipTests

      - name: Montar a configuração MCP e o prompt
        id: prompt
        run: |
          jar="$GITHUB_WORKSPACE/.code-sentinela/servidor-mcp/target/code-sentinela.jar"
          printf '{"mcpServers":{"code-sentinela":{"type":"stdio","command":"java","args":["-jar","%s"]}}}' "$jar" > "$RUNNER_TEMP/mcp.json"
          argumentos="${{ github.repository }} ${{ github.event.pull_request.number }} --publicar"
          # O prompt é o mesmo do comando /revisar-pr, sem o cabeçalho (frontmatter).
          texto=$(awk 'n>=2 {print} /^---$/ {n++}' .code-sentinela/.claude/commands/revisar-pr.md | sed "s#\$ARGUMENTS#${argumentos}#g")
          {
            echo "texto<<FIM_DO_PROMPT"
            echo "$texto"
            echo "FIM_DO_PROMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Revisar com o Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          # O servidor MCP usa este token para ler o PR e publicar a revisão.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.texto }}
          claude_args: >-
            --mcp-config ${{ runner.temp }}/mcp.json
            --allowedTools "mcp__code-sentinela__ler_pull_request,mcp__code-sentinela__ler_arquivo,mcp__code-sentinela__buscar_convencoes,mcp__code-sentinela__listar_convencoes,mcp__code-sentinela__rodar_testes,mcp__code-sentinela__publicar_revisao"
            --max-turns 40
